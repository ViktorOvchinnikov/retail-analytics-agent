[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics-agent"
version = "0.1.0"
description = "Minimal retail data analysis agent prototype"
requires-python = ">=3.11"
dependencies = [
  "google-cloud-bigquery==3.46.2",
  "langchain-google-genai==4.4.2",
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite==3.1.2",
  "pydantic==2.14.1",
  "python-dotenv==1.2.4",
  "sqlglot==29.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
retail-agent = "retail_agent.cli:main"

[tool.setuptools.packages.find]
include = ["retail_agent*", "evals*"]

[tool.setuptools.package-data]
retail_agent = ["data/*.json"]
evals = ["*.json", "reference_sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: uses real Gemini and BigQuery services",
  "evaluation: runs the opt-in Golden Evaluation Dataset against real services",
]
